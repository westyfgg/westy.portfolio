body::before {
    position: fixed;
    z-index: -1;
    background:
        radial-gradient(ellipse at 50% 35%, transparent 15%, rgba(5, 7, 18, 0.52) 100%),
        linear-gradient(120deg, rgba(32, 27, 76, 0.2), transparent 48%, rgba(13, 64, 95, 0.16));
    content: "";
    inset: 0;
    pointer-events: none;
}

.backdrop {
    position: fixed;
    z-index: -1;
    overflow: hidden;
    filter: blur(70px);
    inset: 0;
    pointer-events: none;
}

.ambient-glow {
    position: absolute;
    width: min(42vw, 480px);
    aspect-ratio: 1;
    border-radius: 50%;
    opacity: 0.25;
    animation: drift 22s ease-in-out infinite alternate;
}

.ambient-glow-one {
    top: 7%;
    left: 4%;
    background: #5140bd;
}

.ambient-glow-two {
    right: 4%;
    bottom: 2%;
    background: #007da1;
    animation-delay: -9s;
}

.ambient-stars {
    position: absolute;
    opacity: 0.35;
    background-image:
        radial-gradient(1px 1px at 11% 24%, #e2e5ff 50%, transparent 100%),
        radial-gradient(1px 1px at 71% 12%, #c5caff 50%, transparent 100%),
        radial-gradient(1.5px 1.5px at 88% 65%, #fff 50%, transparent 100%),
        radial-gradient(1px 1px at 32% 83%, #d3d8ff 50%, transparent 100%),
        radial-gradient(1px 1px at 60% 92%, #b3caff 50%, transparent 100%);
    background-size: 370px 320px;
    animation: stars-drift 50s linear infinite alternate;
    inset: 0;
}

.profile-card {
    width: min(100%, 440px);
    padding: clamp(26px, 6vw, 42px) clamp(20px, 6vw, 38px) 24px;
    border: 1px solid rgba(207, 216, 255, 0.16);
    border-radius: 30px;
    background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.055), transparent 42%),
        var(--glass);
    box-shadow:
        0 28px 100px rgba(0, 0, 0, 0.48),
        0 0 70px rgba(88, 91, 206, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(22px);
    animation: card-enter 750ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.profile-header {
    text-align: center;
}

.avatar-frame {
    display: grid;
    width: 94px;
    height: 94px;
    margin: 0 auto 20px;
    padding: 3px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--cyan), #8f79ff 56%, #ef91d5);
    box-shadow: 0 0 32px rgba(126, 138, 255, 0.34);
    animation: avatar-enter 700ms 100ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

.avatar {
    display: grid;
    width: 100%;
    height: 100%;
    overflow: hidden;
    place-items: center;
    border: 3px solid #111329;
    border-radius: inherit;
    background: radial-gradient(circle at 35% 25%, #414c82, #171a35 70%);
    color: #f8f7ff;
    font-size: 38px;
    font-weight: 600;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.username {
    margin: 0;
    font-size: clamp(30px, 8vw, 37px);
    font-weight: 600;
    letter-spacing: -0.065em;
    line-height: 1.18;
    animation: content-enter 650ms 180ms ease both;
}

.profile-caption {
    margin: 10px 0 0;
    color: #a7abc1;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.19em;
    line-height: 1.7;
    animation: content-enter 650ms 240ms ease both;
}

.profile-caption span {
    padding: 0 4px;
    color: var(--cyan);
}

.quote {
    margin: 23px 0 28px;
    padding: 0 0 0 14px;
    border-left: 2px solid transparent;
    border-image: linear-gradient(180deg, var(--cyan), var(--violet)) 1;
    color: #d6d7e8;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.8;
    text-align: left;
    text-wrap: pretty;
    animation: content-enter 650ms 300ms ease both;
}

.link-list {
    display: grid;
    gap: 11px;
}

.link-button {
    position: relative;
    display: flex;
    min-height: 57px;
    align-items: center;
    gap: 14px;
    padding: 0 17px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(110deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.025));
    color: #f1f2ff;
    text-decoration: none;
    transition:
        border-color 200ms ease,
        background-color 200ms ease,
        box-shadow 200ms ease,
        transform 200ms ease;
}

.link-button::before {
    position: absolute;
    background: linear-gradient(110deg, rgba(133, 224, 255, 0.09), transparent 58%, rgba(172, 142, 255, 0.08));
    content: "";
    inset: 0;
    opacity: 0;
    transition: opacity 200ms ease;
}

a.link-button:hover {
    transform: translateY(-2px);
    border-color: rgba(148, 203, 255, 0.38);
    background-color: rgba(74, 85, 146, 0.18);
    box-shadow: 0 9px 26px rgba(46, 92, 170, 0.15);
}

a.link-button:hover::before,
a.link-button:focus-visible::before {
    opacity: 1;
}

a.link-button:active {
    transform: translateY(0);
}

a.link-button:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
}

.link-icon,
.link-title,
.link-arrow {
    position: relative;
}

.link-icon {
    display: grid;
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    place-items: center;
    border-radius: 9px;
    background: rgba(143, 156, 255, 0.11);
    color: #a8dfff;
}

.link-icon svg {
    display: block;
    width: 17px;
    height: 17px;
}

.link-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.005em;
}

.link-arrow {
    color: #8c91ac;
    font-size: 15px;
    transition: color 200ms ease, transform 200ms ease;
}

a.link-button:hover .link-arrow {
    transform: translate(2px, -2px);
    color: var(--cyan);
}

.link-disabled {
    border-color: rgba(205, 211, 255, 0.09);
    background: rgba(255, 255, 255, 0.022);
    color: #8d91a7;
}

.link-disabled .link-icon {
    background: rgba(143, 156, 255, 0.06);
    color: #858ba9;
}

.empty-links {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
}

.footer {
    margin-top: 26px;
    color: #858aa2;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-align: center;
    animation: content-enter 650ms 600ms ease both;
}

.link-button:nth-child(1) { animation: content-enter 560ms 350ms ease both; }
.link-button:nth-child(2) { animation: content-enter 560ms 390ms ease both; }
.link-button:nth-child(3) { animation: content-enter 560ms 430ms ease both; }
.link-button:nth-child(4) { animation: content-enter 560ms 470ms ease both; }
.link-button:nth-child(5) { animation: content-enter 560ms 510ms ease both; }
.link-button:nth-child(6) { animation: content-enter 560ms 550ms ease both; }
.link-button:nth-child(7) { animation: content-enter 560ms 590ms ease both; }

@keyframes card-enter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes avatar-enter {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes content-enter {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes drift {
    from { transform: translate3d(-5%, -3%, 0) scale(0.94); }
    to { transform: translate3d(9%, 8%, 0) scale(1.08); }
}

@keyframes stars-drift {
    from { transform: translateY(0); }
    to { transform: translateY(-18px); }
}

@media (max-width: 480px) {
    body {
        padding: 24px 14px;
        background-attachment: scroll;
    }

    .profile-card {
        border-radius: 25px;
    }

    .link-button {
        min-height: 56px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}
